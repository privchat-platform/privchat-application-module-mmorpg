# module-mmorpg 的错误码注册表。
#
# 本模块**自持**自己的业务码:核心通信层不需要认识 SceneNotFound 这类玩法
# 概念,`TransferResponse.code` 本来就是整数,SDK 与客户端原样透传即可。
#
# `privchat-protocol` 的 registry 只**保留**下面两个段位(reserved_only),
# 不登记具体码 —— 保留是为了防止核心把已被业务占用的号段再分配一次,
# 那正是 20900(Sync ↔ Transfer)与 20920(Bot ↔ ServerEvent ↔ BotLifecycle)
# 两组真实碰撞的成因。
#
# 本表与核心表同构,可用同一个门禁脚本校验。

[[segment]]
range = "21400-21499"
domain = "mmo-battle"
owner = "privchat-application-module-mmorpg"
note = "回合制战斗协议,见 privchat-docs MMO_BATTLE_PROTOCOL_SPEC §9"

[[segment]]
range = "21600-21699"
domain = "mmo-scene"
owner = "privchat-application-module-mmorpg"
note = "世界与场景协议,见 privchat-docs MMO_WORLD_SCENE_SPEC §9.1"

